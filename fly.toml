# Fly.io app config. Before deploying:
#   1. Change `app` below to something globally unique (Fly app names are
#      shared across ALL Fly users, so "nifty50-dashboard" is almost
#      certainly taken).
#   2. Create the app + volume first (see DEPLOY.md), then `fly deploy`.
#
# primary_region = "bom" (Mumbai) - closest to NSE and to India-based usage,
# lowest latency for the live poll loop hitting Yahoo Finance.

app = "REPLACE-WITH-YOUR-UNIQUE-APP-NAME"
primary_region = "bom"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  # Both of these matter: this app runs a background scheduler (live poll
  # every 60s during market hours, 17:00 IST daily report) that must keep
  # running even with zero HTTP traffic. Fly's default free-tier behavior
  # scales machines to zero when idle, which would silently kill that
  # scheduler - min_machines_running=1 + auto_stop_machines="off" prevent that.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[mounts]
  source = "nifty_data"
  destination = "/app/data"
